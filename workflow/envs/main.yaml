name: rindti_clean

channels:
  - conda-forge
  - bioconda
  - pytorch
  - nvidia

dependencies:
  # --- Core ---
  - python=3.9
  - snakemake
  - snakemake-minimal
  - pyyaml

  # --- PyTorch + GPU ---
  - pytorch=2.4
  - pytorch-cuda=12.4
  - torchvision
  - torchaudio

  # --- Scientific Python ---
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - statsmodels

  # --- Plotting ---
  - matplotlib
  - seaborn

  # --- Chemistry / ML utils ---
  - rdkit
  - pytorch-lightning
  - tensorboard
  - torchmetrics
  - xgboost

  # --- Utility ---
  - requests
  - tqdm
  - joblib

  - pip:
      - torch-geometric
      - glycowork
      - gdown